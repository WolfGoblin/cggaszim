<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CG Gas — Contact &amp; Quick Links</title>
<meta name="description" content="Get in touch with CG Gas Harare. Call, WhatsApp, or visit us for LP gas deliveries, installations and repairs."/>
<link rel="icon" type="image/png" href="images/brand/cg-gas-logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<style>

/* ============================================================
   RESET & BASE
   ============================================================ */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: #0c0e12;
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 16px;
  position: relative;
  overflow-x: hidden;
}

/* ============================================================
   OFFICE BACKGROUND (CLEAR & VISIBLE)
   ============================================================ */

/* 1. Real Office Photo - High visibility */
.bg-office {
  position: fixed;
  inset: 0;
  background-image: url('images/brand/cg-gas-main-office.jpg');
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  filter: brightness(0.62) contrast(1.08) saturate(1.1);
  transform: scale(1.01);
  z-index: 0;
  pointer-events: none;
}

/* 2. Clean Neutral Tint (No Red Blur) */
.bg-overlay {
  position: fixed;
  inset: 0;
  background:
    /* Subtle edge vignette to frame content */
    radial-gradient(circle at center, rgba(12, 14, 18, 0.25) 30%, rgba(8, 10, 14, 0.70) 100%),
    /* Gentle vertical gradient for readability */
    linear-gradient(180deg, rgba(8, 10, 14, 0.45) 0%, rgba(8, 10, 14, 0.50) 50%, rgba(6, 7, 10, 0.75) 100%);
  z-index: 1;
  pointer-events: none;
}

/* ============================================================
   PAGE WRAPPER
   ============================================================ */

.page-wrap {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 580px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  margin: auto 0;
}

/* ============================================================
   BRANDING & CLEAN LOGO (NO RED BLUR)
   ============================================================ */

.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 12px;
}

.logo-wrapper {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 24px;
  border-radius: 16px;
  background: rgba(14, 18, 24, 0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

.brand-logo {
  height: 84px;
  width: auto;
  max-width: 210px;
  object-fit: contain;
  filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.7));
  transition: transform 0.3s ease;
}

.brand-logo:hover {
  transform: scale(1.02);
}

.brand-tagline {
  font-family: 'Montserrat', sans-serif;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: #ffffff;
  text-transform: uppercase;
  background: rgba(10, 12, 16, 0.6);
  padding: 4px 14px;
  border-radius: 20px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
}

/* ============================================================
   CLEAN SHIMMER DIVIDERS
   ============================================================ */

.shimmer-divider {
  width: 100%;
  max-width: 440px;
  height: 2px;
  background: rgba(255, 255, 255, 0.20);
  overflow: hidden;
  position: relative;
  border-radius: 2px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
}

.shimmer-divider span {
  position: absolute;
  top: 0;
  height: 100%;
}

.shimmer-fast {
  left: -25%;
  width: 25%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent);
  animation: shimFast 2.2s linear infinite;
}

.shimmer-mid {
  left: -40%;
  width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
  animation: shimMid 3.8s linear infinite;
}

.shimmer-slow {
  left: -60%;
  width: 60%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
  animation: shimSlow 6s linear infinite;
}

@keyframes shimFast  { from { left: -25%; } to { left: 100%; } }
@keyframes shimMid   { from { left: -40%; } to { left: 100%; } }
@keyframes shimSlow  { from { left: -60%; } to { left: 100%; } }

/* ============================================================
   HEADLINE
   ============================================================ */

.headline {
  text-align: center;
}

.headline h1 {
  font-family: 'Montserrat', sans-serif;
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #ffffff;
  background: rgba(10, 12, 16, 0.6);
  padding: 5px 16px;
  border-radius: 20px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
}

/* ============================================================
   CTA GRID & GLASS BUTTONS
   ============================================================ */

#cg-cta {
  width: 100%;
}

.cta-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
  width: 100%;
}

.cta-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;

  padding: 16px 18px;

  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  line-height: 1.4;
  text-transform: uppercase;

  color: #ffffff !important;
  text-decoration: none !important;
  text-align: center;

  /* Crisp Frosted Glass */
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);

  background: rgba(12, 16, 22, 0.78);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 10px;

  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);

  cursor: pointer;
  transition:
    background 0.25s ease,
    border-color 0.25s ease,
    transform 0.25s ease,
    box-shadow 0.25s ease;

  position: relative;
  pointer-events: auto;
}

.cta-btn:visited {
  color: #ffffff !important;
  text-decoration: none !important;
}

.cta-btn:hover {
  background: rgba(22, 28, 38, 0.92);
  border-color: rgba(255, 255, 255, 0.4);
  color: #ffffff !important;
  transform: translateY(-2px);
  box-shadow:
    0 12px 30px rgba(0, 0, 0, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.25);
  text-decoration: none !important;
}

.cta-btn:active {
  transform: translateY(0);
}

.cta-btn:focus-visible {
  outline: 2px solid #ffffff;
  outline-offset: 3px;
}

/* Standard Button Icons */
.cta-btn svg {
  width: 18px;
  height: 18px;
  min-width: 18px;
  stroke: #ffffff;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
  pointer-events: none;
  transition: transform 0.25s ease;
}

.cta-btn:hover svg {
  transform: scale(1.1);
}

/* ============================================================
   PROMINENT WHATSAPP BUTTON & ICON
   ============================================================ */

.cta-btn-whatsapp {
  border-color: rgba(37, 211, 102, 0.45);
  background: rgba(10, 22, 16, 0.82);
  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.45),
    0 0 14px rgba(37, 211, 102, 0.15),
    inset 0 1px 0 rgba(37, 211, 102, 0.25);
}

.cta-btn-whatsapp:hover {
  background: rgba(14, 32, 22, 0.94);
  border-color: #25D366;
  box-shadow:
    0 12px 30px rgba(0, 0, 0, 0.55),
    0 0 22px rgba(37, 211, 102, 0.35),
    inset 0 1px 0 rgba(37, 211, 102, 0.4);
}

/* High-Visibility WhatsApp Icon Badge */
.whatsapp-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  background: #25D366;
  border-radius: 50%;
  box-shadow: 0 2px 8px rgba(37, 211, 102, 0.5);
  flex-shrink: 0;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.whatsapp-badge svg {
  width: 16px !important;
  height: 16px !important;
  min-width: 16px !important;
  fill: #ffffff !important;
  stroke: none !important;
}

.cta-btn-whatsapp:hover .whatsapp-badge {
  transform: scale(1.12);
  box-shadow: 0 4px 12px rgba(37, 211, 102, 0.7);
}

/* ============================================================
   FULL-WIDTH (DIRECTIONS) BUTTON
   ============================================================ */

.cta-wide {
  grid-column: span 2;
  justify-content: space-between;
  padding-left: 22px;
  padding-right: 22px;
}

.cta-wide-label {
  display: flex;
  align-items: center;
  gap: 12px;
}

.cta-btn svg.cta-arrow {
  width: 18px;
  height: 18px;
  min-width: 18px;
  stroke: #ffffff;
  transition: transform 0.25s ease;
}

.cta-wide:hover .cta-arrow {
  transform: translateX(5px);
}

/* ============================================================
   FOOTER TEXT
   ============================================================ */

.footer-text {
  font-size: 11.5px;
  color: rgba(255, 255, 255, 0.75);
  letter-spacing: 0.08em;
  text-align: center;
  background: rgba(10, 12, 16, 0.6);
  padding: 6px 18px;
  border-radius: 20px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
}

/* ============================================================
   MOBILE RESPONSIVENESS
   ============================================================ */

@media (max-width: 460px) {
  body {
    padding: 24px 12px;
  }

  .page-wrap {
    gap: 18px;
  }

  .cta-grid {
    gap: 10px;
  }

  .cta-btn {
    padding: 13px 10px;
    font-size: 11px;
    letter-spacing: 0.08em;
    gap: 8px;
  }

  .cta-btn svg {
    width: 16px;
    height: 16px;
    min-width: 16px;
  }

  .whatsapp-badge {
    width: 22px;
    height: 22px;
  }

  .whatsapp-badge svg {
    width: 14px !important;
    height: 14px !important;
    min-width: 14px !important;
  }

  .cta-wide {
    padding-left: 14px;
    padding-right: 14px;
  }

  .brand-logo {
    height: 72px;
  }

  .brand-tagline {
    font-size: 10px;
    letter-spacing: 0.16em;
  }

  .headline h1 {
    font-size: 11.5px;
  }
}

</style>
</head>
